<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <linearGradient id="hexGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
  </defs>

  <!-- Fondo circular -->
  <circle cx="100" cy="100" r="95" fill="url(#bgGradient)"/>

  <!-- Elementos isométricos decorativos de fondo -->
  <g opacity="0.45">
    <!-- Mini cubos isométricos en esquinas -->
    <g transform="translate(40, 40)">
      <path d="M 0,-8 L 10,-4 L 0,0 L -10,-4 Z" fill="#60a5fa"/>
      <path d="M 10,-4 L 10,8 L 0,12 L 0,0 Z" fill="#3b82f6"/>
      <path d="M -10,-4 L -10,8 L 0,12 L 0,0 Z" fill="#2563eb"/>
    </g>
    <g transform="translate(160, 160)">
      <path d="M 0,-8 L 10,-4 L 0,0 L -10,-4 Z" fill="#60a5fa"/>
      <path d="M 10,-4 L 10,8 L 0,12 L 0,0 Z" fill="#3b82f6"/>
      <path d="M -10,-4 L -10,8 L 0,12 L 0,0 Z" fill="#2563eb"/>
    </g>
    <g transform="translate(55, 155)">
      <path d="M 0,-8 L 10,-4 L 0,0 L -10,-4 Z" fill="#60a5fa"/>
      <path d="M 10,-4 L 10,8 L 0,12 L 0,0 Z" fill="#3b82f6"/>
      <path d="M -10,-4 L -10,8 L 0,12 L 0,0 Z" fill="#2563eb"/>
    </g>
  </g>

  <!-- Hexágonos concéntricos (efecto profundidad) -->
  <g transform="translate(100, 100)">
    <!-- Hexágono exterior decorativo -->
    <polygon points="0,-80 69,-40 69,40 0,80 -69,40 -69,-40"
             fill="none"
             stroke="#3b82f6"
             stroke-width="1.5"
             opacity="0.3"/>

    <!-- Cara superior del hexágono (efecto isométrico) - AL FONDO -->
    <polygon points="0,-70 25,-88 65,-68 60,-35 0,-55"
             fill="none"
             opacity="0.6"
             stroke="#60a5fa"
             stroke-width="2"/>

    <!-- Hexágono principal -->
    <polygon points="0,-70 60,-35 60,35 0,70 -60,35 -60,-35"
             fill="url(#hexGradient)"
             stroke="#60a5fa"
             stroke-width="4"/>
  </g>

  <!-- Texto PTR grande con borde (estilo cubo) -->
  <text x="100" y="115"
        font-family="Arial, sans-serif"
        font-size="44"
        font-weight="900"
        fill="#60a5fa"
        text-anchor="middle"
        stroke="#0f172a"
        stroke-width="3"
        paint-order="stroke">
    PTR
  </text>

  <!-- Flecha hacia arriba (velocidad del alt2) -->
  <g transform="translate(100, 30)">
    <path d="M 0,-12 L 6,0 L -6,0 Z" fill="#fbbf24" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="-2" y="0" width="4" height="10" fill="#fbbf24" rx="1"/>
    <!-- Líneas de velocidad -->
    <line x1="-10" y1="3" x2="-6" y2="3" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
    <line x1="10" y1="3" x2="6" y2="3" stroke="#fbbf24" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- Cohetes decorativos (estilo favicon) distribuidos alrededor -->
  <!-- Cohete superior derecha -->
  <g transform="translate(155, 55)">
    <path d="M 0,-6 L -3,0 L 0,6 L 3,0 Z" fill="#60a5fa"/>
    <circle cx="0" cy="0" r="1.5" fill="#93c5fd"/>
  </g>

  <!-- Cohete superior izquierda -->
  <g transform="translate(45, 55) rotate(120)">
    <path d="M 0,-6 L -3,0 L 0,6 L 3,0 Z" fill="#60a5fa" opacity="0.8"/>
    <circle cx="0" cy="0" r="1.5" fill="#93c5fd" opacity="0.8"/>
  </g>

  <!-- Cohete inferior -->
  <g transform="translate(100, 175) rotate(180)">
    <path d="M 0,-6 L -3,0 L 0,6 L 3,0 Z" fill="#60a5fa" opacity="0.7"/>
    <circle cx="0" cy="0" r="1.5" fill="#93c5fd" opacity="0.7"/>
  </g>

  <!-- Puntos de conexión (nodos) alrededor del hexágono -->
  <g fill="#60a5fa" opacity="0.6">
    <circle cx="100" cy="30" r="3"/>
    <circle cx="160" cy="65" r="3"/>
    <circle cx="160" cy="135" r="3"/>
    <circle cx="100" cy="170" r="3"/>
    <circle cx="40" cy="135" r="3"/>
    <circle cx="40" cy="65" r="3"/>
  </g>

  <!-- Líneas de conexión suaves con efecto isométrico -->
  <g stroke="#3b82f6" stroke-width="2" fill="none" opacity="0.2">
    <line x1="100" y1="30" x2="155" y2="55"/>
    <line x1="160" y1="65" x2="155" y2="55"/>
    <line x1="40" y1="65" x2="45" y2="55"/>
    <line x1="100" y1="30" x2="45" y2="55"/>
    <!-- Líneas hacia abajo -->
    <line x1="100" y1="170" x2="160" y2="135"/>
    <line x1="100" y1="170" x2="40" y2="135"/>
  </g>

  <!-- Partículas pequeñas de energía (estilo alt2) -->
  <circle cx="70" cy="45" r="2.5" fill="#93c5fd" opacity="0.7"/>
  <circle cx="130" cy="45" r="2" fill="#60a5fa" opacity="0.6"/>
  <circle cx="145" cy="100" r="2" fill="#93c5fd" opacity="0.5"/>
  <circle cx="55" cy="100" r="2" fill="#93c5fd" opacity="0.5"/>
  <circle cx="75" cy="155" r="2.5" fill="#60a5fa" opacity="0.7"/>
  <circle cx="125" cy="155" r="2" fill="#60a5fa" opacity="0.6"/>
  <circle cx="100" cy="50" r="1.5" fill="#fbbf24" opacity="0.5"/>

  <!-- Borde decorativo principal -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#60a5fa" stroke-width="2.5" opacity="0.4"/>
</svg>
